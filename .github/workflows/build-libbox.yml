name: Build libbox.aar

on:
  workflow_dispatch:
  push:
    branches:
      - testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # WAJIB: Mengambil seluruh riwayat git & tag agar 'read_tag' bisa menghitung versi
          fetch-depth: 0 

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          # Gunakan NDK versi 26 atau 27 (r25c terlalu lama untuk sing-box terbaru)
          ndk-version: r26d
          add-to-path: true
          link-to-sdk: true

      - name: Build libbox.aar
        run: |
          go run ./cmd/internal/build_libbox -target android

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
          if-no-files-found: error
