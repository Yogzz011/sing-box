name: Build libbox.aar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Atau gunakan '1.25' untuk versi terbaru

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.2.11394342' # NDK yang direkomendasikan, jangan gunakan r25c
          
      - name: Build libbox.aar
        run: |
          # Pastikan environment variable ter-set
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342
          # Jalankan build dengan parameter yang lengkap
          go run ./cmd/internal/build_libbox -target android -platform android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
